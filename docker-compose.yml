version: '3.8'

services:
  # PostgreSQL database for LangGraph checkpointer and pgvector
  postgres:
    image: pgvector/pgvector:pg14
    container_name: langpath-postgres
    environment:
      POSTGRES_DB: langgraph
      POSTGRES_USER: triagebot
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triagebot -d langgraph"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - langpath

  # Gitea issue tracker
  gitea:
    image: gitea/gitea:1.21
    container_name: langpath-gitea
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=postgres:5432
      - GITEA__database__NAME=gitea
      - GITEA__database__USER=triagebot
      - GITEA__database__PASSWD=${DB_PASSWORD:-changeme}
      - GITEA__server__HTTP_PORT=3000
      - GITEA__server__SSH_PORT=222
      - GITEA__server__DISABLE_SSH=false
      - GITEA__server__OFFLINE_MODE=false
    ports:
      - "3000:3000"
      - "222:22"
    volumes:
      - gitea_data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - langpath
    restart: unless-stopped

  # Triage service (Python FastAPI app)
  triage-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: langpath-triage
    environment:
      - DATABASE_URL=postgresql://triagebot:${DB_PASSWORD:-changeme}@postgres:5432/langgraph
      - GITEA_URL=http://gitea:3000
      - GITEA_TOKEN=${GITEA_TOKEN:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY:-}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT:-bug-triage-dev}
      - LANGSMITH_TRACING=${LANGSMITH_TRACING:-true}
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src:ro
      - ./scripts:/app/scripts:ro
    depends_on:
      postgres:
        condition: service_healthy
      gitea:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - langpath
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  gitea_data:
    driver: local

networks:
  langpath:
    driver: bridge
